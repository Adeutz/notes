<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#0b0d10;color:#f2f4f7;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100dvh}
#lock{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
.box{width:100%;max-width:360px;text-align:center}
.ic{font-size:44px;line-height:1;margin-bottom:18px}
h1{font-size:19px;font-weight:650;letter-spacing:-.01em;margin:0 0 8px}
p{margin:0 0 22px;font-size:14px;line-height:1.55;color:#a9b1be}
input{width:100%;padding:14px 15px;font-size:16px;text-align:center;
  font-family:ui-monospace,Menlo,monospace;color:#f2f4f7;background:#14171c;
  border:1px solid #2e333c;border-radius:8px;outline:none}
input:focus{border-color:#3987e5;box-shadow:0 0 0 3px rgba(57,135,229,.22)}
button{width:100%;margin-top:10px;padding:14px;font-size:15px;font-weight:600;
  color:#fff;background:#3987e5;border:0;border-radius:8px;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.err{margin-top:14px;font-size:13.5px;color:#e66767;min-height:19px}
.hint{margin-top:20px;font-size:12px;color:#79818e;line-height:1.5}
</style>
</head>
<body>
<div id="lock"><div class="box">
  <div class="ic">&#128274;</div>
  <h1>This plan is encrypted</h1>
  <p>Enter the passphrase to unlock it on this device.</p>
  <form id="f" autocomplete="off">
    <input id="pw" type="password" inputmode="text" placeholder="passphrase"
           autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Passphrase">
    <button id="go" type="submit">Unlock</button>
  </form>
  <div class="err" id="err"></div>
  <div class="hint">Everything decrypts on your phone. Nothing is sent anywhere,
    and it works with no signal once installed.</div>
</div></div>

  for(var i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a; }

async function unlock(pass, remember){
  var raw = b64(BLOB);
  var salt = raw.slice(0,16), iv = raw.slice(16,28), rest = raw.slice(28);
  var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass),
             {name:'PBKDF2'}, false, ['deriveKey']);
  var key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:salt, iterations:ITER, hash:'SHA-256'},
      base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  var plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:iv}, key, rest);
  var html = new TextDecoder().decode(plain);
  if (remember) { try{ sessionStorage.setItem('pp', pass); }catch(e){} }
  boot(html);
}

function boot(html){
  document.title = 'The Monthly Plan';
  var i = html.indexOf('<' + '/style>');
  var head = html.slice(0, i + 8), rest = html.slice(i + 8);
  var j = rest.indexOf('<' + 'script>'), k = rest.lastIndexOf('<' + '/script>');
  var body = rest.slice(0, j), js = rest.slice(j + 8, k);

  document.head.insertAdjacentHTML('beforeend', head);
  document.head.insertAdjacentHTML('beforeend',
    '<style>@media (max-width:760px){.wrap{padding:0 14px 64px}' +
    'input.th,input.ac{width:88px;padding:8px 6px;font-size:16px}' +
    '.picker button{min-width:96px;padding:13px 8px}' +
    '.editbar button{padding:12px 15px}.tabs button{padding:12px 13px}' +
    '.iobtns button{padding:12px 15px}}</style>');
  document.body.innerHTML = body;
  document.body.style.background = '';
  document.body.style.color = '';
  var s = document.createElement('script');
  s.textContent = js;
  document.body.appendChild(s);
}

document.getElementById('f').addEventListener('submit', async function(e){
  e.preventDefault();
  var pw = document.getElementById('pw').value;
  var err = document.getElementById('err'), go = document.getElementById('go');
  if (!pw) return;
  err.textContent=''; go.disabled=true; go.textContent='Unlocking\u2026';
  try { await unlock(pw, true); }
  catch(ex){
    err.textContent = 'Wrong passphrase.';
    go.disabled=false; go.textContent='Unlock';
    document.getElementById('pw').select();
  }
});

/* re-open within the same session without retyping */
(async function(){
  try{
    var p = sessionStorage.getItem('pp');
    if (p) await unlock(p, false);
  }catch(e){ try{ sessionStorage.removeItem('pp'); }catch(_){} }
})();

if ('serviceWorker' in navigator)
  navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
